  /api/v1/search:
    get:
      description: |-
        结果 href 指向命中对象：RSS 来源 /feed?source_id={id}、RSS 文章 /feed/item/{id}、播客节目 /podcasts/show/{slug}、时间线事件 /timeline?event={id}。旧业务搜索 API 保留供编辑器选材等用途。
        blog 已接入 post（标题/摘要/正文全文）、short_note、channel、collection；频道和合集必须包含公开已发布博客文章。forum 已接入 topic，回复及回复作者命中返回所属主题，仅检索匿名可见板块，登录身份不扩大范围。两域均要求关键词，支持 relevance、recent；文章可按 author_id/channel_id/collection_id/tag、短笺按 author_id、主题按 category_id/tag 筛选。
        music 公开搜索已接入 song、album、artist、playlist，支持歌曲/专辑/艺术家及别名关联、歌词原文与翻译、歌单名称。公开音乐搜索必须提供关键词，仅声明 relevance 排序；即使管理员登录也不会返回草稿或私人歌单。
        preview 每组 2 条，grouped 每组 6 条；list 必须选择单个 module/type。filter[key] 仅接受 capabilities 声明的字段，重复值为 OR、不同字段为 AND。已接入 books 的 work、author、book_list（仅 public）；作品支持 language、author_id、year_from、year_to，年份为 1–9999 的整数，匹配任一有效公开版本。rating_desc 复用信誉加权评分和 6 人门槛。现有搜索入口不受影响。
        scope=mine 必须登录，仅检索当前账号：books 支持 note（私人笔记标题/正文）、book_list（自建书单草稿标题/简介）、library（书架作品标题/简介）、bookmark（收藏书单的可见发布快照）；music 支持 playlist（自建歌单）和 bookmark（收藏且仍可访问的歌单），匹配歌单名称。个人类型均支持 relevance、recent；明确指定 module/type 时允许空关键词发现。不使用共享缓存，摘要最长 240 字；收藏不授予撤回、私有或已删除内容的访问权限，管理员不能扩大 mine 的账号范围。
      parameters:
      - description: 关键词，最多 256 个 Unicode 字符
        in: query
        name: q
        type: string
      - default: public
        description: 范围；mine 需 Cookie 或 API Token 登录
        enum:
        - public
        - mine
        in: query
        name: scope
        type: string
      - description: 已注册模块
        in: query
        name: module
        type: string
      - collectionFormat: multi
        description: 内容类型，可重复
        in: query
        items:
          type: string
        name: type
        type: array
      - default: grouped
        description: 结果模式
        enum:
        - preview
        - grouped
        - list
        in: query
        name: view
        type: string
      - description: 已注册排序
        in: query
        name: sort
        type: string
      - default: 1
        description: list 页码，offset 不超过 10000
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 24
        description: list 页大小
        in: query
        maximum: 50
        minimum: 1
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/search.SearchEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/search.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/search.ErrorEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/search.ErrorEnvelope'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/search.ErrorEnvelope'
      summary: 统一内容搜索
      tags:
      - search
