info:
  contact: {}
  description: Atoman 后端 API 文档。
  title: Atoman API
  version: "1.0"
paths:
  /api/v1/admin/announcements:
    post:
      consumes:
      - application/json
      description: 仅管理员可发布，公告会作为系统通知投递给所有活跃用户。
      parameters:
      - description: 公告内容
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/notification.PublishAnnouncementInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/notification.PublishAnnouncementResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      - CookieAuth: []
      summary: 发布站点公告
      tags:
      - notifications
  /api/v1/admin/artists/{id}/merge:
    post:
      consumes:
      - application/json
      description: 将源艺人的音乐关联、收藏和别名迁移到目标艺人，并设置 redirect_to。
      parameters:
      - description: 目标艺人 UUID
        in: path
        name: id
        required: true
        type: string
      - description: 艺人合并输入
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/handlers.ArtistMergeInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      - CookieAuth: []
      summary: 合并艺人
      tags:
      - music-artists
  /api/v1/admin/channels/{id}/owner:
    put:
      consumes:
      - application/json
      parameters:
      - description: 频道 UUID
        in: path
        name: id
        required: true
        type: string
      - description: 新所有者
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/handlers.transferChannelOwnershipInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Channel'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 转移频道所有权
      tags:
      - admin-users
  /api/v1/admin/comment-reports:
    get:
      parameters:
      - description: 状态：pending/upheld/rejected
        in: query
        name: status
        type: string
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页数量，最多50
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/comment.ReportQueueResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/comment.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/comment.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/comment.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/comment.ErrorResponse'
      security:
      - BearerAuth: []
      - CookieAuth: []
      summary: 获取评论举报队列
      tags:
      - comment-admin
  /api/v1/admin/comments/{comment_id}/moderation:
    put:
      consumes:
      - application/json
      parameters:
      - description: 评论 UUID
        in: path
        name: comment_id
        required: true
        type: string
      - description: 审核动作
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/comment.ModerateInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/comment.ActionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/comment.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/comment.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/comment.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/comment.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/comment.ErrorResponse'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/comment.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/comment.ErrorResponse'
      security:
      - BearerAuth: []
      - CookieAuth: []
      summary: 审核评论或举报
      tags:
      - comment-admin
  /api/v1/admin/dm/reports:
    get:
      parameters:
      - description: cursor
        in: query
        name: cursor
        type: string
      - description: limit
        in: query
        name: limit
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dm.ReportsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dm.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dm.ErrorResponse'
      security:
      - BearerAuth: []
      - CookieAuth: []
      summary: List DM reports
      tags:
      - dm-admin
  /api/v1/admin/dm/reports/{id}:
    put:
      description: Cookie authentication requires X-CSRF-Token and a trusted Origin.
        CSRF failures return dm.CSRFErrorResponse.
      parameters:
      - description: CSRF token for cookie authentication
        in: header
        name: X-CSRF-Token
        required: true
        type: string
      - description: report ID
        in: path
        name: id
        required: true
        type: string
      - description: review
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/dm.ReviewReportInput'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dm.ReportResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dm.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dm.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dm.ErrorResponse'
      security:
      - BearerAuth: []
      - CookieAuth: []
      summary: Review DM report
      tags:
      - dm-admin
  /api/v1/admin/feed/fulltext/crawl:
    post:
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Start a managed feed article crawl
      tags:
      - admin-feed-fulltext
  /api/v1/admin/feed/sources/{id}/diagnostics:
    get:
      description: 返回最近 90 天的全文抓取失败和恢复记录。
      parameters:
      - description: 订阅源 UUID
        in: path
        name: id
        required: true
        type: string
      - description: 页码
        in: query
        name: page
        type: integer
      - description: 每页数量
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: 获取订阅源诊断历史
      tags:
      - admin
  /api/v1/admin/feed/sources/{id}/impact:
    get:
      parameters:
      - description: 订阅源 UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.adminFeedSourceImpact'
      security:
      - BearerAuth: []
      summary: 预览订阅源永久删除影响
      tags:
      - admin
  /api/v1/admin/music/entries:
    get:
      description: 管理员按类型和状态筛选音乐 wiki 条目。
      parameters:
      - description: 条目类型
        enum:
        - all
        - album
        - artist
        - song
        in: query
        name: type
        type: string
      - description: 编辑状态
        enum:
        - all
        - development
        - locked
        - closed
        in: query
        name: status
        type: string
      - description: 页码
        in: query
        name: page
        type: integer
      - description: 每页数量
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.MusicEntryListResponse'
      security:
      - BearerAuth: []
      - CookieAuth: []
      summary: 获取音乐条目后台列表
      tags:
      - music-entry-status
  /api/v1/admin/music/quality:
    get:
      description: 管理员查看缺失封面、曲目、音频、关键元数据、重复候选和失败导入的音乐资料。
      parameters:
      - description: 问题类型
        enum:
        - all
        - missing_cover
        - missing_tracks
        - missing_audio
        - missing_metadata
        - duplicate_candidate
        - processing_failed
        - import_failed
        in: query
        name: type
        type: string
      - description: 页码
        in: query
        name: page
        type: integer
      - description: 每页数量
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取音乐资料问题
      tags:
      - music-entry-status
  /api/v1/admin/user-audit-logs:
    get:
      parameters:
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页数量
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.AdminAuditLogListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      - CookieAuth: []
      summary: 管理员获取用户管理操作记录
      tags:
      - admin-users
  /api/v1/admin/users:
    get:
      description: 管理员可分页搜索未删除用户，并按角色和账号状态筛选。
      parameters:
      - description: 用户名、邮箱或显示名
        in: query
        name: q
        type: string
      - description: 角色
        enum:
        - user
        - moderator
        - admin
        - owner
        in: query
        name: role
        type: string
      - default: all
        description: 账号状态
        enum:
        - all
        - active
        - inactive
        in: query
        name: status
        type: string
      - default: all
        description: 登录时间
        enum:
        - all
        - 7d
        - inactive_30d
        - never
        in: query
        name: activity
        type: string
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页数量，最大 100
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.AdminUserListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      - CookieAuth: []
      summary: 管理员获取用户列表
      tags:
      - admin-users
    post:
      consumes:
      - application/json
      description: 管理员只能创建普通用户，站长可创建普通用户或管理员。
      parameters:
      - description: 用户信息
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateAdminUserInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.AdminUserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
