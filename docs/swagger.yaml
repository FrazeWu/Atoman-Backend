info:
  contact: {}
  description: 'Atoman 后端 API 文档。公开及 API Token 接口支持任意 HTTP/HTTPS 网站；第三方使用 Authorization:
    Bearer <API Token> 并设置 credentials: omit，权限沿用账号权限。Cookie 登录仅支持可信来源，写请求仍需 CSRF。浏览器
    WebSocket 使用子协议 atoman 和 atoman.api.<API Token>，不接受 URL query token。R2 上传使用接口下发的预签名地址。'
  title: Atoman API
  version: "1.0"
paths:
  /api/v1/admin/announcements:
    get:
      description: 仅管理员可查看，按发布批次聚合公告通知。
      parameters:
      - description: 页码
        in: query
        name: page
        type: integer
      - description: 每页数量
        in: query
        name: page_size
        type: integer
      - description: 搜索标题、正文或站内路径
        in: query
        name: search
        type: string
      - description: 状态，支持 all 或 delivered
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/notification.AnnouncementDTO'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      - CookieAuth: []
      summary: 获取公告记录
      tags:
      - notifications
    post:
      consumes:
      - application/json
      description: 仅管理员可发布，公告会作为系统通知投递给所有活跃用户。
      parameters:
      - description: 公告内容
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/notification.PublishAnnouncementInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/notification.PublishAnnouncementResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
