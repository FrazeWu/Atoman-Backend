# Dedicated static identities. No login shell, sudo, or Docker membership.
g atoman-papers-api -
g atoman-papers-publish -
u atoman-papers-worker - "Papers compile worker" /nonexistent /usr/sbin/nologin
u atoman-papers-snapshot - "Papers snapshot gateway" /nonexistent /usr/sbin/nologin
u atoman-papers-pdf - "Papers PDF gateway" /nonexistent /usr/sbin/nologin
u atoman-papers-env - "Papers environment gateway" /nonexistent /usr/sbin/nologin
u atoman-papers-publisher - "Papers offline release publisher" /nonexistent /usr/sbin/nologin
m atoman-papers-snapshot atoman-papers-api
m atoman-papers-env atoman-papers-publish
m atoman-papers-publisher atoman-papers-publish
