name: Backend Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  go-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_DATABASE_URL: postgres://atoman_test:atoman_test_password@localhost:5432/atoman_test?sslmode=disable

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atoman_test
          POSTGRES_PASSWORD: atoman_test_password
          POSTGRES_DB: atoman_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atoman_test -d atoman_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run Go unit tests
        run: go test ./...
