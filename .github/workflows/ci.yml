name: Backend CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: atoman_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d atoman_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/atoman_test?sslmode=disable
      TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/atoman_test?sslmode=disable
      REFERENCE_TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/atoman_test?sslmode=disable
      FORUM_TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/atoman_test?sslmode=disable
      MUSIC_POSTGRES_TEST_DSN: postgres://postgres:postgres@localhost:5432/atoman_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go build ./...
