name: Backend CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Pin the image: ubuntu-latest moves to Ubuntu 26 on 2026-10-19 and would
    # change the failure surface while the test suite is being fixed.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: atoman_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d atoman_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/atoman_test?sslmode=disable
      TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/atoman_test?sslmode=disable
      REFERENCE_TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/atoman_test?sslmode=disable
      FORUM_TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/atoman_test?sslmode=disable
      MUSIC_POSTGRES_TEST_DSN: postgres://postgres:postgres@localhost:5432/atoman_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: bash scripts/test-isolated_test.sh
      - run: bash scripts/deploy-production_test.sh
      - run: bash scripts/deploy-rollback_test.sh
      - run: make swagger-check
      - name: go test
        run: |
          set +e
          go test ./... 2>&1 | tee /tmp/gotest.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            # Surface the failing tests as annotations: they render on the
            # commit checks page, so the failure is readable without log access.
            grep -E '^ *--- FAIL:' /tmp/gotest.log | head -8 | cut -c1-190 \
              | sed 's/^/::error title=go test failure::/' || true
            pkgs=$(grep -E '^FAIL[[:space:]]' /tmp/gotest.log | awk '{print $2}' | paste -sd, - || true)
            echo "::error title=go test failed packages::$(echo "$pkgs" | cut -c1-170)"
            exit "$rc"
          fi
      - name: Check reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - run: go vet ./...
      - run: go build ./...
