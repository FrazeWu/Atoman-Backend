# Install as /etc/systemd/system/atoman-backup.service.d/zz-mail-paired.conf
# only after the first paired backup and NAS recovery have passed.
[Unit]
OnFailure=atoman-mail-ops-alert.service

[Service]
TimeoutStartSec=3h
ExecStart=
ExecStart=/usr/bin/python3 /usr/local/libexec/atoman/backup-mail.py --database atoman_prod --database atoman_dev --database atoman_mail --destination /var/backups/atoman/mail --cache /var/backups/atoman/mail-cache --env-file /etc/atoman/backend.env --env-file /etc/atoman-mail/backend.env --runtime-config /etc/atoman/backend.env --runtime-config /etc/atoman-mail --runtime-config /etc/systemd/system/atoman-stalwart.service --runtime-config /etc/systemd/system/atoman-backend.service --runtime-config /etc/systemd/system/atoman-backend.service.d --runtime-config /etc/systemd/system/atoman-mail-outbox.service --runtime-config /etc/systemd/system/atoman-mail-maintenance.service --runtime-config /etc/systemd/system/atoman-mail-maintenance.timer --runtime-config /etc/systemd/system/atoman-mail-backup-health.service --runtime-config /etc/systemd/system/atoman-mail-backup-health.timer --runtime-config /etc/systemd/system/atoman-mail-ops-alert.service --runtime-config /etc/systemd/system/atoman-backup.service.d/zz-mail-paired.conf --runtime-config /etc/tmpfiles.d/atoman-mail-locks.conf --runtime-config /var/lib/atoman-mail/deployment-receipt.json --runtime-config /etc/letsencrypt/archive/mail.atoman.org --runtime-config /etc/letsencrypt/renewal/mail.atoman.org.conf --runtime-config /var/backups/atoman/mail-canary/canary-20261105.json --quiesce-unit atoman-backend.service --quiesce-unit atoman-mail-outbox.service --quiesce-unit atoman-stalwart.service --max-pause-seconds 120 --retain 1
ExecStartPost=
ExecStartPost=/usr/bin/python3 /usr/local/libexec/atoman/publish-mail-backups.py --backup-root /var/backups/atoman/mail --recipient age1rfgu75985jpk7aml06uvdzm0ewa4p7j9ua7l8vut3ek5eueddgfs542fe8 --keep 1
