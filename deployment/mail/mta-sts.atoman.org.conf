server {
    listen 80;
    server_name mta-sts.atoman.org;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://mta-sts.atoman.org$request_uri; }
}
server {
    listen 443 ssl;
    server_name mta-sts.atoman.org;
    ssl_certificate /etc/letsencrypt/live/mail.atoman.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail.atoman.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Content-Type-Options nosniff always;
    location = /.well-known/mta-sts.txt {
        default_type text/plain;
        return 200 "version: STSv1\nmode: testing\nmx: mail.atoman.org\nmax_age: 86400\n";
    }
    location / { return 404; }
}
