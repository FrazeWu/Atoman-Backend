server {
    listen 80;
    server_name mail.atoman.org;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://mail.atoman.org$request_uri; }
}
server {
    listen 443 ssl;
    server_name mail.atoman.org;
    ssl_certificate /etc/letsencrypt/live/mail.atoman.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail.atoman.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    location = / { return 302 https://www.atoman.org/mail; }
    location = /autoconfig/mail/config-v1.1.xml {
        proxy_pass http://127.0.0.1:18580/mail/config-v1.1.xml;
        proxy_set_header Host mail.atoman.org;
        proxy_set_header X-Forwarded-Proto https;
    }
    location / { return 404; }
}
